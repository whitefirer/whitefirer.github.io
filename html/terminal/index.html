<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal — Needle on-device AI</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <script src="https://fastly.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.min.js"></script>
    <script src="/lib/blog-ai.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1a1b26;
        }
        #terminal {
            height: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div id="terminal"></div>
    <script>
        const PROMPT = '\x1b[1;32mvisitor@blog\x1b[0m:\x1b[1;34m~\x1b[0m$ ';

        const term = new Terminal({
            linkHandler: {
                // bypass xterm's default confirm() dialog for OSC8 links
                activate: (event, text) => window.open(text, '_blank'),
            },
            cursorBlink: true,
            fontFamily: '"Cascadia Code", Menlo, Consolas, monospace',
            fontSize: 14,
            theme: { background: '#1a1b26' }
        });
        term.open(document.getElementById('terminal'));

        // ---------- helpers ----------
        const write = (s) => term.write(s);
        const writeln = (s = '') => term.write(s + '\r\n');
        const dim = (s) => `\x1b[2m${s}\x1b[0m`;
        const cyan = (s) => `\x1b[1;36m${s}\x1b[0m`;
        const yellow = (s) => `\x1b[1;33m${s}\x1b[0m`;

        // shared blog AI — the REPL owns prompting, so io.prompt is a noop
        const blogAI = BlogAI.create({
            write: write,
            writeln: writeln,
            prompt: () => {}
        });

        // ---------- state ----------
        let inputBuf = '';
        let cursorPos = 0; // index into inputBuf
        let history = [];
        let historyIdx = -1;
        let busy = false;

        function prompt() {
            write(PROMPT);
            inputBuf = '';
            cursorPos = 0;
        }

        // display-cell width: CJK wide chars occupy 2 cells
        const wcwidth = (ch) => /[ᄀ-ᅟ⺀-鿏가-힣豈-﫿︰-﹏＀-｠￠-￦]/.test(ch) ? 2 : 1;
        const strWidth = (s) => s.split('').reduce((n, ch) => n + wcwidth(ch), 0);

        // full-line redraw, then position the cursor at cursorPos
        function editLine(newBuf, newPos) {
            inputBuf = newBuf;
            cursorPos = newPos;
            write('\r\x1b[2K' + PROMPT + inputBuf);
            const tailWidth = strWidth(inputBuf.slice(cursorPos));
            if (tailWidth > 0) write('\x1b[' + tailWidth + 'D');
        }

        function moveLeft() {
            if (cursorPos <= 0) return;
            cursorPos--;
            write('\x1b[' + wcwidth(inputBuf[cursorPos]) + 'D');
        }
        function moveRight() {
            if (cursorPos >= inputBuf.length) return;
            write('\x1b[' + wcwidth(inputBuf[cursorPos]) + 'C');
            cursorPos++;
        }
        function moveHome() {
            const w = strWidth(inputBuf.slice(0, cursorPos));
            if (w > 0) write('\x1b[' + w + 'D');
            cursorPos = 0;
        }
        function moveEnd() {
            const w = strWidth(inputBuf.slice(cursorPos));
            if (w > 0) write('\x1b[' + w + 'C');
            cursorPos = inputBuf.length;
        }

        // ---------- commands ----------
        function cmdHelp() {
            writeln('可用命令:');
            writeln('  help              显示本帮助');
            writeln('  search <关键词>   直接搜索文章');
            writeln('  describe <关键词> 简要介绍一篇相关文章');
            writeln('  sem <查询>        语义搜索（端侧向量模型，首次约 24MB）');
            writeln('  ls [tag]          列出最新文章（或指定 tag）');
            writeln('  open <序号>       打开上一次结果中的文章');
            writeln('  ai2 on|off        切换 AI 引擎（默认 Needle 2；无法端侧翻译时可 off 切回 Needle 1）');
            writeln('  clear             清屏');
            writeln('  about             关于这个终端');
            writeln('');
            writeln('直接输入自然语言（如「找一下 hugo 相关的文章」）由本地 Needle 模型解析。');
        }

        function cmdAbout() {
            writeln('本终端内置 Needle —— 端侧工具调用模型（默认官方 Needle 2）。');
            writeln('模型在你的浏览器里通过 WASM 本地运行，不经过任何服务器或 LLM API。');
            writeln('运行时: cactus (MIT) · 模型: Cactus Compute Needle (MIT)');
        }

        async function handleInput(raw) {
            const input = raw.trim();
            if (!input) return;

            const [cmd, ...rest] = input.split(/\s+/);
            const argStr = rest.join(' ');

            switch (cmd) {
                case 'help': cmdHelp(); return;
                case 'clear': term.clear(); return;
                case 'about': cmdAbout(); return;
                case 'search': blogAI.printPosts(blogAI.searchPosts(argStr)); return;
                case 'ls': blogAI.listPosts(argStr); return;
                case 'open': blogAI.openResult(parseInt(argStr, 10)); return;
                case 'describe': blogAI.execBlogTool('describe_post', { query: argStr }, ''); return;
                case 'sem': await blogAI.sem(argStr); return;
                case 'ai2': {
                    const a = argStr.toLowerCase();
                    if (a === 'on') {
                        blogAI.setEngine('n2');
                        writeln('已切换到 ' + yellow('Needle 2') + '（默认，英文 query 效果最好；中文会尝试端侧翻译）。ai2 off 切回。');
                    } else if (a === 'off') {
                        blogAI.setEngine('n1');
                        writeln('已切回 ' + yellow('Needle 1') + '（支持中文）。');
                    } else {
                        writeln('当前引擎: ' + (blogAI.getEngine() === 'n2' ? 'Needle 2（默认）' : 'Needle 1') + '。用法: ai2 on | ai2 off');
                    }
                    return;
                }
            }

            // natural language → needle
            await blogAI.route(input);
        }

        // ---------- REPL ----------
        function recallHistory(dir) {
            const next = historyIdx + dir;
            if (next < 0 || next >= history.length) return;
            historyIdx = next;
            write('\r\x1b[2K' + PROMPT + history[historyIdx]);
            inputBuf = history[historyIdx];
            cursorPos = inputBuf.length;
        }

        term.onData(async (data) => {
            if (busy) {
                // model is routing the previous input; Ctrl+C cancels it
                if (data === '\x03') blogAI.cancel();
                return;
            }
            // escape sequences arrive as one string; handle before the char loop
            if (data === '\x1b[A') return recallHistory(-1);
            if (data === '\x1b[B') return recallHistory(1);
            if (data === '\x1b[D') return moveLeft();
            if (data === '\x1b[C') return moveRight();
            if (data === '\x1b[H' || data === '\x1bOH' || data === '\x1b[1~') return moveHome();
            if (data === '\x1b[F' || data === '\x1bOF' || data === '\x1b[4~') return moveEnd();
            if (data === '\x1b[3~') {
                // Delete key: remove the char under the cursor
                if (cursorPos < inputBuf.length) {
                    editLine(inputBuf.slice(0, cursorPos) + inputBuf.slice(cursorPos + 1), cursorPos);
                }
                return;
            }
            if (data.startsWith('\x1b')) return; // ignore other escape sequences
            for (const ch of data) {
                if (ch === '\r') {
                    write('\r\n');
                    const line = inputBuf;
                    if (line.trim()) history.push(line);
                    historyIdx = history.length;
                    busy = true;
                    try {
                        await handleInput(line);
                    } finally {
                        busy = false;
                        prompt();
                    }
                } else if (ch === '\u007F' || ch === '\b') {
                    if (cursorPos > 0) {
                        editLine(inputBuf.slice(0, cursorPos - 1) + inputBuf.slice(cursorPos), cursorPos - 1);
                    }
                } else if (ch >= ' ') {
                    if (cursorPos === inputBuf.length) {
                        // fast path: append at end (covers paste of long strings)
                        inputBuf += ch;
                        cursorPos++;
                        write(ch);
                    } else {
                        editLine(inputBuf.slice(0, cursorPos) + ch + inputBuf.slice(cursorPos), cursorPos + 1);
                    }
                }
            }
        });

        // ---------- boot ----------
        const osc8 = (url, text) => `\x1b]8;;${url}\x07${text || url}\x1b]8;;\x07`;
        (async () => {
            try {
                writeln('欢迎来到 ' + yellow('whitefirer') + ' 的端侧 AI 终端 — ' + osc8('https://whitefirer.org'));
                writeln('正在载入文章索引...');
                const n = await blogAI.loadIndex();
                writeln(`已载入 ${n} 篇文章。`);
            } catch (e) {
                writeln('索引载入失败: ' + e.message);
            }
            writeln('');
            writeln(yellow('Needle Terminal') + dim(' —— 端侧 AI 博客终端'));
            writeln('输入 help 查看命令；直接输入自然语言试试 AI 解析。');
            writeln('');
            prompt();
        })();
    </script>
</body>

</html>
